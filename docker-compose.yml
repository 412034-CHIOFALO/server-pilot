services:
  server-pilot-backend:
    build: ./backend
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/root/.ssh:ro
      - server-pilot-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SP_USER=${SP_USER:-admin}
      - SP_PASS=${SP_PASS:-changeme}
      - SP_SSH_HOST=${SP_SSH_HOST:-host.docker.internal}
      - SP_SSH_USER=${SP_SSH_USER:-ubuntu}
      - SP_SSH_KEY=${SP_SSH_KEY:-/root/.ssh/id_rsa}
    pid: "host"
    restart: always

  server-pilot-frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:12332:80"
    depends_on:
      - server-pilot-backend
    restart: always

  duckdns:
    image: linuxserver/duckdns:latest
    environment:
      - SUBDOMAINS=serverpiloter
      - TOKEN=e6ef2309-3e45-4566-bea0-f07685449d2d
      - LOG_FILE=false
      - TZ=America/Argentina/Buenos_Aires
    restart: always

volumes:
  server-pilot-data:
